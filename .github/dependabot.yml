# Dependabot: revisa cada semana si hay versiones nuevas de las librerías (npm) y de las
# acciones de GitHub, y abre un pull request con la actualización. Cada PR pasa por las
# mismas pruebas automáticas que cualquier cambio: si algo se rompe, no se une.
# Las alertas de seguridad (fallas conocidas) se activan en Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Las actualizaciones chicas (sin cambios que rompan) llegan juntas en un solo PR
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: "ci"
